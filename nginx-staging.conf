# ── staging.kangpos.com ────────────────────────────────────────────────────
# Drop this file at /etc/nginx/sites-available/staging
# then: sudo ln -s /etc/nginx/sites-available/staging /etc/nginx/sites-enabled/
# and:  sudo certbot --nginx -d staging.kangpos.com
# ──────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name staging.kangpos.com;

    # Redirect HTTP → HTTPS (certbot will update this block)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name staging.kangpos.com;

    # SSL — certbot will populate these
    # ssl_certificate     /etc/letsencrypt/live/staging.kangpos.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/staging.kangpos.com/privkey.pem;

    root /var/www/staging;
    index index.html;

    # ── Staging API (port 3001) ──
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }

    # ── Uploads ──
    location /uploads/ {
        alias /home/ubuntu/project1/backend/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Resource-Policy "cross-origin";
    }

    # ── Frontend SPA ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
