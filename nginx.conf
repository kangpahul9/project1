##############################################################
# KangPOS — Nginx Configuration
# Place this file at: /etc/nginx/sites-available/kangpos
# Then: sudo ln -s /etc/nginx/sites-available/kangpos /etc/nginx/sites-enabled/kangpos
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx
##############################################################

server {
    listen 80;
    server_name 3.109.49.119;   # replace with your domain if you have one

    # ── Frontend (React SPA static files) ────────────────────────────────────
    root /var/www/kangpos/frontend;
    index index.html;

    # React Router — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy → Node.js on port 3000 ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check passthrough
    location /health {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # ── Uploads (served directly — no Node involvement) ───────────────────────
    location /uploads/ {
        alias   /var/www/kangpos/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy       "strict-origin" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    expired no-cache no-store private auth;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
